<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>quantification 管理后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.8.4/dist/index.css">
  <style>
    html, body, #app { height: 100%; margin: 0; }
    body { background: #f5f7fa; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .layout { display: flex; height: 100vh; }
    .sidebar { width: 180px; background: #1f2d3d; color: #cfd8e3; flex-shrink: 0; }
    .sidebar .logo { padding: 18px 16px; font-size: 16px; font-weight: 600; color: #fff; border-bottom: 1px solid #2f4050; }
    .sidebar .el-menu { border-right: none; background: transparent; }
    .main { flex: 1; overflow-y: auto; padding: 16px; }
    .card { background: #fff; border-radius: 6px; padding: 16px; margin-bottom: 16px; }
    .metric { display: flex; flex-wrap: wrap; gap: 12px; }
    .metric .item { flex: 1; min-width: 150px; background: #f8fafc; border-radius: 6px; padding: 14px 16px; }
    .metric .label { color: #8492a6; font-size: 12px; }
    .metric .value { font-size: 20px; font-weight: 600; color: #1f2d3d; margin-top: 4px; }
    .metric .hint { color: #a0aec0; font-size: 11px; line-height: 1.35; margin-top: 3px; }
    .chart { height: 360px; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/vue@3.4.38/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-plus@2.8.4/dist/index.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
  <script src="/app.js?v=20261004b"></script>
</body>
</html>
