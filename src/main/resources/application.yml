# ============================================================
# 应用配置（可以提交到 GitHub —— 这里没有任何密钥）
#
# 密钥（数据库密码、Bitget API Key）不在本文件、也不在仓库里，
# 而是放在仓库外的：~/.quantification/application-local.yml
# 由下面的 spring.config.import 自动加载。该文件不会被 git 跟踪，
# 也不会被打进 jar（pom 里有构建校验，命中密钥会直接构建失败）。
#
# 默认走 local（连测试库）；上线时用参数切到生产库：
#   java -jar xxx.jar --spring.profiles.active=prod
# ============================================================

spring:
  application:
    name: quantification
  profiles:
    active: local
  # 后台静态页（index.html / app.js）不做浏览器缓存：否则改完前端后，
  # 浏览器一直用旧 app.js，会出现"接口已是新格式、页面还是旧样式"的假象。
  web:
    resources:
      cache:
        cachecontrol:
          no-store: true
  # 从仓库外加载密钥文件。optional 表示文件缺失时仍能启动（会打印告警）；
  # 环境变量优先级高于配置文件，所以 DB_PASSWORD 等仍可覆盖。
  config:
    import: optional:file:${user.home}/.quantification/application-local.yml
  # 定时任务线程池：默认只有 1 个线程，篮子同步/实时费率/历史回补会互相排队
  task:
    scheduling:
      pool:
        size: 4
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
      # 下面两个要比 MySQL 服务端的 wait_timeout 小，
      # 否则会用到已经被服务端悄悄断掉的连接，报 "communications link failure"
      idle-timeout: 300000
      max-lifetime: 600000

# MyBatis：把数据库的下划线字段自动映射到 Java 的驼峰属性
mybatis:
  configuration:
    map-underscore-to-camel-case: true

# Bitget 接入
#   base-url    ：接口地址（公共行情无需密钥）
#   paptrading  ：true = 走官方模拟盘（用 demo-* 密钥 + paptrading:1 请求头，虚拟资金）；
#                 false = 走实盘。默认 false，本地配置里改成 true 即进入模拟。
#                 两套密钥都在仓库外的 ~/.quantification/application-local.yml 里，不提交、不打包。
bitget:
  base-url: https://api.bitget.com
  paptrading: false
  # HTTP 超时（毫秒）。默认的 JDK HttpClient 不超时：一旦对端连接半开，本地读会永远不返回，
  # 调用线程连同它持有的锁一起卡死（2026-10-06 管理后台打不开、mock 十几个小时不结算就是这个原因）。
  # 设了超时后这类调用会抛异常交给 HttpRetry 重试，属"有界失败"。
  connect-timeout-ms: 5000
  read-timeout-ms: 10000

# 数据采集调度
collector:
  current-initial-delay-ms: 5000     # 启动 5 秒后开始第一次
  current-interval-ms: 600000        # 实时资金费率：每 10 分钟
  history-initial-delay-ms: 8000     # 启动 8 秒后开始第一次
  history-interval-ms: 3600000       # 历史资金费率回补：每 1 小时（原来 6 小时；结算点滞后太久会让资金费迟迟不入账）
  fee-rate-initial-delay-ms: 15000   # 启动 15 秒后采一次费率（等篮子同步完）
  fee-rate-interval-ms: 86400000     # 手续费率（账户真实值）：每天一次

# 收益计算参数（对应 /api/admin/funding-yield）
funding-yield:
  lookback-days: 90          # 统计窗口天数，接口最多给 90 天
  rotation-days: 45          # 平均多少天切换一次币种
  spot-taker-fee-rate: 0.0006  # 现货吃单费率（私有接口实测：0.06%）
  perp-taker-fee-rate: 0.000375 # 合约吃单费率（私有接口实测：0.0375%，公共接口给的是标准值 0.06%）

# 监控篮子自动同步（把"现货 + U 本位永续都有"的币全部纳入）
watch-coin:
  # 目标币种池：24h 成交额下限（USDT）。
  # 2026-10-07 从 500 万提到 2000 万：实测成交额低的币买卖价差极宽（PUMP 建仓时
  # 现货/永续腿间价差吃到 0.28%），而换仓一次的摩擦成本约 0.19%，
  # 在薄盘币上建大仓等于先把几个月的资金费预付给做市商了。
  min-turnover: 20000000
  min-discount-rate: 0.8        # 目标币种池：保证金折扣率下限（低于此值强平风险高）
  sync-initial-delay-ms: 3000   # 启动 3 秒后同步一次（必须早于资金费率采集）
  sync-interval-ms: 86400000    # 之后每天同步一次

# ============================================================
# 策略（模块 3~5）。改这里就能调策略行为，改完重启生效。
# ============================================================
strategy:
  # 总开关。false = 只评估、不下单（第一次跑建议先设 false 观察日志）
  enabled: true
  # 实盘下单的二次确认：paptrading=false（实盘）时，必须同时把这里设为 true 才会真实下单。
  # 这是防止"以为在模拟盘、结果下了真单"的安全闸。
  allow-real-trading: false
  evaluate-interval-ms: 3600000  # 评估频率：每小时一次
  lookback-days: 10              # 综合费率窗口（天），正负累加
  # 建仓门槛：净年化（含成本）≥ 5% 才建仓，低于则宁可空仓
  entry-net: 0.05
  # 换仓门槛：候选必须比"手上最差的那个"高出这么多才值得换。
  # 2026-10-07 从 4 个点提到 10 个点：实测每交易 1 USDT 名义额摩擦成本约 0.0953%，
  # 一次完整换仓（平旧 + 开新）约 0.19%，换算下来 4 个点要持有约 17 天才回本，
  # 而实际持仓只有 1~3 天 —— 门槛太松时每次主动换仓都是亏的。
  switch-gap: 0.10
  # 最短持有期：刚开始的仓位这么多天内不参加"比价换仓"（掉出篮子/跌破门槛的强制平仓不受限）。
  # 和 switch-gap 配套：10 个点约 7 天回本，正好等于这个期限。
  min-holding-days: 7
  max-holdings: 3                # 最多同时持有几个币
  max-single-weight: 0.40        # 单币仓位上限（占总资金）
  recovery-filter: true          # 是否要求"连续为正轮数 > 历史平均恢复轮数"
  target-invest-ratio: 0.95      # 目标投入比例（留 5% 余量做保证金缓冲）

# 下单执行（模块 5）
execution:
  order-timeout-ms: 5000         # IOC 限价单等待成交的上限，超时撤单
  max-retries: 2                 # 超时后重新取盘口重下的次数
  leg-tolerance: 0.005           # 两腿数量容差（0.5%）
  # 限价缓冲：限价 = 对手价 ± 该比例。缓冲只是"能接受的最差价"，
  # FOK 限价单的实际成交价仍是盘口价，所以放宽缓冲几乎不增加成本，只提高成交概率。
  price-buffer: 0.01
  slippage-limit-major: 0.0005   # 主流币滑点上限（每条腿）
  slippage-limit-small: 0.0015   # 小币滑点上限（每条腿）
  major-turnover: 50000000       # 24h 成交额 ≥ 此值算主流币
  min-order-notional: 20         # 单笔最小名义金额（USDT），低于则跳过
  depth-limit: 100               # 取盘口多少档用于估算可下单量

# 交易对规则同步（模块 2/5）：精度、最小/最大值、乘数必须落库，下单时从库里取
# 教训：参数绝不能猜，也不要下单时临时查——曾因数量精度不符导致现货腿被拒，
# 合约腿已成交形成裸多头，正好撞上行情下跌造成实际亏损（2026-09-23）
instrument:
  sync-initial-delay-ms: 10000   # 启动 10 秒后同步一次（早于策略首次评估）
  sync-interval-ms: 3600000      # 之后每小时同步一次

# ============================================================
# 自建 mock（模块 9）：验证策略收益用（官方模拟盘只覆盖 4 个币，且资金费金额口径不可信）
#
# **已定方案：默认走自建 mock（不走官方模拟盘、不动 demo 账户）。**
#
# enabled=true 时：
#   * 行情 / 费率 / 盘口仍然读真实接口；
#   * 下单 / 撤单 / 查单在本地模拟撮合（按真实盘口深度算成交价与滑点），
#     模拟成交落库到 trade_order / trade_fill（source=mock），不会发出任何真实交易请求；
#   * 资金费由程序自己按"真实费率 × 真实仓位"入账（funding_income，source=mock）。
# enabled=false 时才会用 bitget.paptrading 决定走实盘还是官方模拟盘（现在不用）。
# ============================================================
simulation:
  enabled: true                  # 总开关：true = 用自建 mock 交易所（当前默认）
  initial-usdt: 30000            # 模拟账户初始资金（USDT），只在第一次运行（库里没有账户）时生效；第一期投入 3 万
  maintenance-margin-rate: 0.02  # 维持保证金率假设（算 mgnRatio 用，2% 偏保守）
  depth-limit: 100               # 市价单最多吃多少档盘口（IOC/FOK 限价单按限价决定吃多少）
  ticker-cache-ms: 5000          # 最新价缓存时长，避免一轮评估里反复打行情接口
  rolling-days: 30               # 状态接口默认展示的滚动年化窗口（天）
  funding-initial-delay-ms: 30000  # 启动 30 秒后开始结算资金费
  funding-settle-interval-ms: 60000 # 资金费结算扫描间隔（结算点数据来自历史费率表，幂等）
  snapshot-initial-delay-ms: 30000  # 启动 30 秒后记第一条净值
  snapshot-interval-ms: 3600000     # 之后每小时记一条（净值曲线 / 滚动年化的数据源）

# 主机资源监控（模块 10 后台"机器监控"页）：采集这台机器的 CPU / 内存 / 磁盘 / 负载，画历史曲线。
# 数据来自 JVM 自带 MXBean + 文件系统容量查询，不启子进程，开销可忽略。
host-monitor:
  initial-delay-ms: 20000        # 启动 20 秒后采第一条
  sample-interval-ms: 60000      # 每 1 分钟采一条（90 天约 13 万行，很小）
  disk-path: /                   # 监控哪个路径所在磁盘的容量

# 风控（模块 6）
risk:
  max-drawdown: 0.05             # 账户权益从峰值回撤 5% → 全平并停止策略
  position-watch-interval-ms: 5000  # 持仓/权益轮询间隔（每 5 秒）
  mgn-ratio-warn: 0.5            # 维持保证金率预警线（mgnRatio = mmr / effEquity）
  mgn-ratio-reduce: 0.8          # 维持保证金率减仓线
  mark-index-deviation-warn: 0.01   # 标记价与指数价偏离 1% → 告警
  mark-index-deviation-pause: 0.03  # 偏离 3% → 暂停开新仓
  mark-index-deviation-halt: 0.05   # 偏离 5% → 熔断

# 告警（模块 6）。
#   * SMTP 密码是密钥，只放仓库外 ~/.quantification/application-local.yml 的 alert.mail.password。
#   * 注意：application.yml 的优先级高于外置文件，所以这里【不能】写 password 这一项，
#     否则空值会盖掉外置文件的真密码（troubleshooting 1.3 已踩过坑）。
alert:
  mail:
    enabled: true               # 配好 SMTP 后打开
    host: smtp.qq.com           # QQ 邮箱发信服务器；换服务商改这里
    port: 465                   # 465 = SSL；用 587 会自动走 STARTTLS
    username: 421791582@qq.com  # 完整 QQ 邮箱地址（发信账号）
    from: ""                    # 发件人，留空则等于 username（自己发给自己也可以）
    to: 421791582@qq.com        # 收件人，多个用英文逗号分隔
    cooldown-seconds: 300       # 同一告警主题的节流间隔，避免同一事件反复发
  transient-failures-before-warning: 6   # 连续多少次瞬时网络失败后发提醒（不熔断，仍自动重试）
  # 看门狗：专盯"程序还活着、但什么都不干"的沉默型故障（卡死、死锁、线程被占死）。
  # 事件驱动的告警（熔断 / 网络异常）覆盖不到这类情况，必须靠"心跳停了"来发现。
  watchdog:
    enabled: true
    check-interval-ms: 300000   # 每 5 分钟查一次
    stale-ms: 9000000           # 距上次成功跑完评估超过 2.5 小时（评估每小时一次）→ 告警
    remind-ms: 3600000          # 一直没恢复则每小时再提醒一次

---
# ===== 本地开发环境：连测试库 =====
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/quantification_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: quant_app
    # 密码不写在这里，来自仓库外的 ~/.quantification/application-local.yml

---
# ===== 生产环境：连生产库 =====
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/quantification_prod?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: quant_app
    # 密码不写在这里，来自仓库外的 ~/.quantification/application-local.yml
