# ============================================================
# 应用配置（可以提交到 GitHub —— 这里没有任何密钥）
#
# 密钥（数据库密码、Bitget API Key）不在本文件、也不在仓库里，
# 而是放在仓库外的：~/.quantification/application-local.yml
# 由下面的 spring.config.import 自动加载。该文件不会被 git 跟踪，
# 也不会被打进 jar（pom 里有构建校验，命中密钥会直接构建失败）。
#
# 默认走 local（连测试库）；上线时用参数切到生产库：
#   java -jar xxx.jar --spring.profiles.active=prod
# ============================================================

spring:
  application:
    name: quantification
  profiles:
    active: local
  # 从仓库外加载密钥文件。optional 表示文件缺失时仍能启动（会打印告警）；
  # 环境变量优先级高于配置文件，所以 DB_PASSWORD 等仍可覆盖。
  config:
    import: optional:file:${user.home}/.quantification/application-local.yml
  # 定时任务线程池：默认只有 1 个线程，篮子同步/实时费率/历史回补会互相排队
  task:
    scheduling:
      pool:
        size: 4
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
      # 下面两个要比 MySQL 服务端的 wait_timeout 小，
      # 否则会用到已经被服务端悄悄断掉的连接，报 "communications link failure"
      idle-timeout: 300000
      max-lifetime: 600000

# MyBatis：把数据库的下划线字段自动映射到 Java 的驼峰属性
mybatis:
  configuration:
    map-underscore-to-camel-case: true

# Bitget 接入
#   base-url    ：接口地址（公共行情无需密钥）
#   paptrading  ：true = 走官方模拟盘（用 demo-* 密钥 + paptrading:1 请求头，虚拟资金）；
#                 false = 走实盘。默认 false，本地配置里改成 true 即进入模拟。
#                 两套密钥都在仓库外的 ~/.quantification/application-local.yml 里，不提交、不打包。
bitget:
  base-url: https://api.bitget.com
  paptrading: false

# 数据采集调度
collector:
  current-initial-delay-ms: 5000     # 启动 5 秒后开始第一次
  current-interval-ms: 600000        # 实时资金费率：每 10 分钟
  history-initial-delay-ms: 8000     # 启动 8 秒后开始第一次
  history-interval-ms: 21600000      # 历史资金费率回补：每 6 小时
  fee-rate-initial-delay-ms: 15000   # 启动 15 秒后采一次费率（等篮子同步完）
  fee-rate-interval-ms: 86400000     # 手续费率（账户真实值）：每天一次

# 收益计算参数（对应 /api/admin/funding-yield）
funding-yield:
  lookback-days: 90          # 统计窗口天数，接口最多给 90 天
  rotation-days: 45          # 平均多少天切换一次币种
  spot-taker-fee-rate: 0.0006  # 现货吃单费率（私有接口实测：0.06%）
  perp-taker-fee-rate: 0.000375 # 合约吃单费率（私有接口实测：0.0375%，公共接口给的是标准值 0.06%）

# 监控篮子自动同步（把"现货 + U 本位永续都有"的币全部纳入）
watch-coin:
  min-turnover: 5000000         # 目标币种池：24h 成交额下限（USDT），默认 500 万
  min-discount-rate: 0.8        # 目标币种池：保证金折扣率下限（低于此值强平风险高）
  sync-initial-delay-ms: 3000   # 启动 3 秒后同步一次（必须早于资金费率采集）
  sync-interval-ms: 86400000    # 之后每天同步一次

# ============================================================
# 策略（模块 3~5）。改这里就能调策略行为，改完重启生效。
# ============================================================
strategy:
  # 总开关。false = 只评估、不下单（第一次跑建议先设 false 观察日志）
  enabled: true
  # 实盘下单的二次确认：paptrading=false（实盘）时，必须同时把这里设为 true 才会真实下单。
  # 这是防止"以为在模拟盘、结果下了真单"的安全闸。
  allow-real-trading: false
  evaluate-interval-ms: 3600000  # 评估频率：每小时一次
  lookback-days: 10              # 综合费率窗口（天），正负累加
  # 建仓门槛：净年化。正常用 0.05；
  # 临时降到 0.04 是为了在官方模拟盘上跑通流程（模拟盘只支持 BTC/ETH/DOGE/SOL，
  # 其中现货报价可信的只有 BTC，而 BTC 净年化约 4.5%）。验证完请改回 0.05。
  entry-net: 0.04
  switch-gap: 0.04               # 换仓门槛：候选比最差持仓高 4 个百分点
  max-holdings: 3                # 最多同时持有几个币
  max-single-weight: 0.40        # 单币仓位上限（占总资金）
  recovery-filter: true          # 是否要求"连续为正轮数 > 历史平均恢复轮数"
  target-invest-ratio: 0.95      # 目标投入比例（留 5% 余量做保证金缓冲）

# 下单执行（模块 5）
execution:
  order-timeout-ms: 5000         # IOC 限价单等待成交的上限，超时撤单
  max-retries: 2                 # 超时后重新取盘口重下的次数
  leg-tolerance: 0.005           # 两腿数量容差（0.5%）
  # 限价缓冲：限价 = 对手价 ± 该比例。缓冲只是"能接受的最差价"，
  # FOK 限价单的实际成交价仍是盘口价，所以放宽缓冲几乎不增加成本，只提高成交概率。
  price-buffer: 0.01
  slippage-limit-major: 0.0005   # 主流币滑点上限（每条腿）
  slippage-limit-small: 0.0015   # 小币滑点上限（每条腿）
  major-turnover: 50000000       # 24h 成交额 ≥ 此值算主流币
  min-order-notional: 20         # 单笔最小名义金额（USDT），低于则跳过
  depth-limit: 100               # 取盘口多少档用于估算可下单量

# 交易对规则同步（模块 2/5）：精度、最小/最大值、乘数必须落库，下单时从库里取
# 教训：参数绝不能猜，也不要下单时临时查——曾因数量精度不符导致现货腿被拒，
# 合约腿已成交形成裸多头，正好撞上行情下跌造成实际亏损（2026-09-23）
instrument:
  sync-initial-delay-ms: 10000   # 启动 10 秒后同步一次（早于策略首次评估）
  sync-interval-ms: 3600000      # 之后每小时同步一次

# 风控（模块 6）
risk:
  max-drawdown: 0.05             # 账户权益从峰值回撤 5% → 全平并停止策略
  position-watch-interval-ms: 5000  # 持仓/权益轮询间隔（每 5 秒）
  mgn-ratio-warn: 0.5            # 维持保证金率预警线（mgnRatio = mmr / effEquity）
  mgn-ratio-reduce: 0.8          # 维持保证金率减仓线
  mark-index-deviation-warn: 0.01   # 标记价与指数价偏离 1% → 告警
  mark-index-deviation-pause: 0.03  # 偏离 3% → 暂停开新仓
  mark-index-deviation-halt: 0.05   # 偏离 5% → 熔断

# 告警（模块 6）。密码属于密钥，只放仓库外的 application-local.yml
alert:
  mail:
    enabled: false               # 先关闭；配好 SMTP 后改成 true
    host: ""
    port: 465
    username: ""
    password: ""
    from: ""
    to: ""

---
# ===== 本地开发环境：连测试库 =====
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/quantification_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: quant_app
    # 密码不写在这里，来自仓库外的 ~/.quantification/application-local.yml

---
# ===== 生产环境：连生产库 =====
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/quantification_prod?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: quant_app
    # 密码不写在这里，来自仓库外的 ~/.quantification/application-local.yml
